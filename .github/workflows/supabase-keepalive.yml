# Mantiene despierto el proyecto de Supabase de la Misión secreta.
# Los proyectos gratuitos se pausan tras 7 días sin actividad; esta tarea
# hace una consulta de solo lectura cada 3 días para evitarlo.
# Se puede borrar este archivo cuando ya no haga falta (por ejemplo, después de la boda).
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 8 */3 * *"   # cada 3 días, 08:17 UTC
  workflow_dispatch: {}       # también se puede lanzar a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        env:
          SUPABASE_URL: https://kgrtklnkhlqotkpkdmfr.supabase.co
          # Clave pública (la misma que ya usa la web en el navegador)
          SUPABASE_KEY: sb_publishable_93S0dmDPVoOcOHhXzUs-9Q_eXBLpgGb
        run: |
          code=$(curl -s -o respuesta.json -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/admin_status" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "Respuesta de Supabase: HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase no responde (¿proyecto pausado?). Reanúdalo desde el panel de Supabase."
            exit 1
          fi
