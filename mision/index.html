<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Misión secreta · Sara &amp; Joshua</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="../images/mision-logo.svg">
<link rel="icon" type="image/png" sizes="64x64" href="../images/mision-favicon.png">
<link rel="apple-touch-icon" href="../images/mision-apple-touch.png">
<meta name="theme-color" content="#895129">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@300..700&display=swap">
<style>
/* Layout: la misión secreta dentro de la web de la boda. Mismo papel kraft, focos de color y paneles de cristal que la portada; el invitado ve una sola columna y el panel/pantalla usan el ancho completo. */
:root{
  color-scheme:light;
  --paper:#F3EEE5; --cream:#F9F4EC; --card-solid:#FBF7F0;
  --ink:#3B2210; --brown:#895129; --muted:#7A5236; --line:rgba(137,81,41,.22);
  --teal:#41E0CF; --teal-deep:#0F7A6C; --teal-soft:rgba(65,224,207,.24);
  --salmon:#EC8F6E; --salmon-deep:#B24A1F; --salmon-soft:rgba(236,143,110,.22);
  --display:"Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{background:var(--paper);overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.55 var(--body);background-color:var(--paper);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:url("../images/paper.jpg") center/cover no-repeat}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;text-wrap:balance;letter-spacing:-.02em}
a{color:var(--teal-deep)}
:focus-visible{outline:2px solid var(--teal-deep);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}

/* Focos de color detrás del cristal */
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45}
.orbs i:nth-child(1){width:46vmax;height:46vmax;left:-16vmax;top:14vh;background:var(--teal);animation:drift1 26s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;top:50vh;background:var(--salmon);animation:drift2 31s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:28vmax;height:28vmax;left:36vw;top:-10vh;background:#F3C77A;opacity:.35;animation:drift3 23s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vw,-12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-16vh) scale(.9)}}
@keyframes drift3{to{transform:translate(10vw,30vh) scale(1.2)}}

/* Cristal líquido (igual que en la web) */
.sheet,.panel-box,.resume,.keep,.login form,.demo-bar,.backbar a{
  background:linear-gradient(140deg,rgba(255,255,255,.52),rgba(255,255,255,.24));
  -webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);
  border:1px solid rgba(255,255,255,.62);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.85),inset 0 -2px 6px rgba(255,255,255,.25),0 22px 46px -14px rgba(59,34,16,.26)}

/* Botones */
button,.btn{font:700 15px/1 var(--body);letter-spacing:.01em;border-radius:999px;padding:13px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;position:relative;
  color:var(--ink);border:1px solid rgba(255,255,255,.7);background:linear-gradient(180deg,rgba(150,245,234,.98),rgba(65,224,207,.92));
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.85),inset 0 -2px 4px rgba(20,130,118,.18),0 10px 22px -8px rgba(65,224,207,.7);
  transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s}
button:hover,.btn:hover{transform:translateY(-1px)}
button:active,.btn:active{transform:scale(.97)}
.ghost{color:var(--brown)!important;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.26))!important;border-color:rgba(255,255,255,.7)!important;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.85),0 6px 14px -8px rgba(59,34,16,.3)!important}
.ghost:hover{background:rgba(255,255,255,.85)!important}
.danger{background:rgba(255,255,255,.4)!important;color:var(--salmon-deep)!important;border-color:rgba(178,74,31,.3)!important;box-shadow:none!important}
.danger.armed{background:var(--salmon-deep)!important;color:#fff!important}
.small{padding:9px 14px;font-size:13.5px}
button:disabled{opacity:.5;cursor:default;transform:none}
input[type=text],input[type=email],input[type=password],input[type=number],select{font:600 17px var(--body);color:var(--ink);background:rgba(255,255,255,.72);border:1px solid rgba(137,81,41,.25);border-radius:14px;padding:13px 16px;width:100%}
input:focus,select:focus{border-color:transparent;outline:2px solid var(--teal-deep);outline-offset:1px}
.label{font:700 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.status{font-size:14.5px;font-weight:600;min-height:22px}
.status.err{color:var(--salmon-deep)}
.status.ok{color:var(--teal-deep)}

/* Vuelta a la web */
.backbar{max-width:1240px;margin:0 auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.backbar a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;text-decoration:none;color:var(--ink);font:700 14px var(--body)}
.backbar a img{height:22px;width:auto}
.backbar.guestw{max-width:520px}

/* Vista previa */
.demo-bar{max-width:1240px;margin:12px auto 0;padding:10px 14px;border-radius:18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.demo-bar nav{display:flex;gap:6px;flex-wrap:wrap}
.demo-bar a{font:700 13px var(--body);color:var(--brown);text-decoration:none;padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.demo-bar a[aria-current]{background:var(--teal);color:var(--ink);box-shadow:none}

/* ---------- Invitado ---------- */
.guest{position:relative;max-width:520px;margin:0 auto;padding-top:30px;display:flex;flex-direction:column;gap:20px}
.branch{position:absolute;pointer-events:none;user-select:none;z-index:0}
.guest .branch{width:300px;top:-6px;right:-150px;transform:rotate(-58deg);opacity:.9}
@media (min-width:760px){.guest .branch{width:560px;top:120px;right:auto;left:-470px;transform:rotate(-84deg)}}
.guest>*:not(.branch){position:relative;z-index:1}
.hero{display:flex;flex-direction:column;gap:4px;padding-right:70px}
.kicker{display:flex;align-items:center;gap:.7rem;font:700 12.5px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--brown);margin:0}
.kicker::before{content:"";width:30px;height:2px;background:var(--salmon);flex:none}
.kicker svg{width:15px;height:15px;fill:var(--salmon)}
.names{font:800 clamp(52px,15vw,74px)/.92 var(--display);color:var(--ink);letter-spacing:-.045em;margin-top:10px}
.names span{display:block}
.names span+span{color:var(--salmon)}
.wm{margin:10px 0 0;line-height:0}
.wm img{display:block;width:min(300px,64vw);height:auto}
.wm-sm{display:block;width:min(140px,40vw);height:auto;margin-top:10px}
.poster .wm{margin:6px 0 2px}
.poster .wm img{width:240px;max-width:100%;margin:0 auto}
.live-wm{margin-top:10px}
.live-wm img{width:clamp(200px,20vw,320px)}
.date{font:600 clamp(20px,5.5vw,24px)/1.2 var(--display);color:var(--brown);margin:14px 0 0;letter-spacing:-.01em}
.place{font:600 13px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
.intro{font-size:18px;margin:0;max-width:40ch}
.sheet{border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.form{display:flex;flex-direction:column;gap:12px}
.resume{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;text-decoration:none;color:var(--ink);border-radius:22px;padding:14px 18px}
.resume img{grid-row:1/span 2;width:40px;height:auto}
.resume strong{font:700 21px var(--display);letter-spacing:-.015em}
.resume small{grid-column:2;color:var(--teal-deep);font-weight:700}
.resume i{grid-row:1/span 2;grid-column:3;font-style:normal;font-size:22px;color:var(--teal-deep)}
.progress{display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:rgba(137,81,41,.14);border-radius:99px;overflow:hidden}
.track div{height:100%;background:linear-gradient(90deg,var(--teal),#8AF0E4);border-radius:99px;transition:width .6s}
.retos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reto{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}
.retos .phase{list-style:none;padding:18px 0 6px;font:700 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--brown);display:flex;align-items:center;gap:.6rem}
.retos .phase::before{content:"";width:22px;height:2px;background:var(--salmon)}
.retos .phase:first-child{padding-top:4px}
.reto .n{font:800 24px var(--display);color:var(--salmon);font-variant-numeric:tabular-nums}
.reto .t{font-weight:700;line-height:1.3}
.reto.done .n{color:var(--teal-deep)}
.reto.done .t{color:var(--muted);font-weight:600}
.reto .side{display:flex;align-items:center;gap:8px}
.shoot{display:flex;flex-direction:column;align-items:center;gap:4px}
.shoot label.again{font-size:11.5px}
.reto .side img{width:54px;height:54px;object-fit:cover;border-radius:14px;border:2px solid #fff;box-shadow:0 0 0 2px var(--teal)}
label.btn input,label.again input{position:absolute;inset:0;opacity:0;width:1px;height:1px}
label.again{font:700 12.5px var(--body);color:var(--muted);text-decoration:underline;cursor:pointer;position:relative}
.notice{margin:0;font-size:15px;font-weight:600;color:var(--ink);background:var(--teal-soft);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center}
.notice svg{flex:none;width:22px;height:22px;color:var(--teal-deep)}
.notice.prize{background:var(--salmon-soft)}
.notice.prize svg{color:var(--salmon-deep)}
.spot img{animation:fadein .9s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.win{background:var(--teal-soft);border-radius:16px;padding:14px 16px;font-weight:700;color:var(--teal-deep)}
.keep{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-radius:20px;padding:16px 18px}
.keep .row{display:flex;gap:8px}
.keep input{font:600 13px var(--body);padding:9px 12px}

/* Juego oculto */
.lock-t{font:700 26px/1.15 var(--display);color:var(--ink)}
.lock-n{display:flex;flex-wrap:wrap;gap:.45rem}
.lock-n i{width:1.9rem;height:1.9rem;border-radius:12px;border:1.5px dashed rgba(137,81,41,.45)}
/* Interruptor del juego en el panel */
.gate{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.gate .gtxt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.gate strong{display:flex;align-items:center;gap:10px;font:700 19px var(--display);letter-spacing:-.01em}
.gate strong::before{content:"";width:12px;height:12px;border-radius:50%;flex:none;background:rgba(137,81,41,.35)}
.gate.on strong::before{background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.gate span{font-size:14px;color:var(--muted)}
.gate .gact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-basis:100%}
.gate form input[type=password]{flex:1 1 240px;width:auto;font-size:15px;padding:10px 13px}
.gate form label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.gate .status{flex-basis:100%;min-height:0}
.gate .status:empty{display:none}

/* ---------- Panel de los novios ---------- */
.admin{max-width:1240px;margin:0 auto;padding-top:22px;position:relative}
.admin.screen{max-width:1500px;padding-top:28px}
.a-top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding-bottom:16px}
.a-brand{display:flex;align-items:center;gap:14px}
.a-brand img{width:48px;height:auto;border-radius:12px;box-shadow:0 6px 14px -6px rgba(15,122,108,.6)}
.game-logo{display:block;width:60px;height:60px;border-radius:15px;margin-bottom:12px;box-shadow:0 10px 22px -10px rgba(15,122,108,.7)}
.resume img{border-radius:10px}
.a-brand h1{font:700 28px/1.1 var(--display);color:var(--ink)}
.a-brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.a-user{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px;scrollbar-width:none}
.tabs a{font:700 14px var(--body);color:var(--muted);text-decoration:none;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current]{color:var(--ink);border-color:var(--teal)}
.panel-box{border-radius:24px;padding:20px}
.section-title{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.section-title h2{font:700 30px/1.1 var(--display);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.login{max-width:440px;margin:40px auto;display:flex;flex-direction:column;gap:14px;position:relative}
.login>*:not(.branch){position:relative;z-index:1}
.login h1{font:800 40px/1 var(--display);color:var(--ink);letter-spacing:-.035em}
.login form{border-radius:24px;padding:20px}
.login .branch{width:320px;top:-80px;right:-150px;transform:rotate(-30deg);opacity:.85}

/* Directo */
.live-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 34px;margin-bottom:20px}
.live-dot{display:inline-flex;align-items:center;gap:12px;font:700 16px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--salmon-deep)}
.live-dot::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--salmon);box-shadow:0 0 0 4px var(--salmon-soft);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.live-names{font:800 clamp(40px,5.2vw,68px)/1 var(--display);color:var(--ink);letter-spacing:-.04em;margin-top:6px}
.stats{display:flex;gap:30px;flex-wrap:wrap}
.stat b{display:block;font:800 clamp(34px,4vw,54px)/1 var(--display);color:var(--salmon);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.live-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.live-grid{grid-template-columns:1fr}}
.spot{position:relative;border-radius:26px;overflow:hidden;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.6);box-shadow:0 22px 46px -14px rgba(59,34,16,.3);aspect-ratio:4/3;max-width:100%}
.spot img{width:100%;height:100%;object-fit:cover;display:block}
.spot .cap{position:absolute;inset:auto 0 0 0;padding:60px 22px 18px;background:linear-gradient(transparent,rgba(30,14,4,.78));color:#fff;display:flex;flex-direction:column;gap:2px}
.spot .cap strong{font:700 clamp(22px,2.5vw,34px)/1.15 var(--display);letter-spacing:-.02em}
.spot .cap span{font-size:14.5px;opacity:.9;font-weight:600}
.spot .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.spot.flash{animation:flash 1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 8px var(--teal)}to{box-shadow:0 0 0 0 transparent}}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.feed figure{margin:0;position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.4)}
.feed img{width:100%;height:100%;object-fit:cover;display:block}
.feed figcaption{position:absolute;inset:auto 0 0 0;font:700 11.5px/1.2 var(--body);color:#fff;padding:18px 8px 7px;background:linear-gradient(transparent,rgba(30,14,4,.75))}
.board h3{font:700 24px var(--display);color:var(--ink);margin-bottom:6px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);transition:background .5s}
.rank li:last-child{border-bottom:0}
.rank .pos{font:800 18px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.rank li:first-child .pos{color:var(--salmon)}
.rank .who{font-weight:700;min-width:0;overflow-wrap:anywhere}
.rank .who small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.rank li.bump{background:var(--teal-soft)}
.dots{display:flex;gap:4px;align-items:center}
.dots{flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(137,81,41,.18)}
.dots i.on{background:var(--teal)}
.dots b{font:800 20px var(--display);min-width:24px;text-align:right;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--salmon-soft);color:var(--ink)}

/* Invitados */
.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:52px minmax(160px,1.4fr) 130px 90px 120px auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.prow.head{font:700 11.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-block:6px 10px}
.prow .num{font:800 20px var(--display);color:var(--salmon);font-variant-numeric:tabular-nums}
.prow .name-edit{display:flex;gap:6px}
.prow .name-edit input{padding:9px 12px;font-size:15px;border-radius:10px}
.prow .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){
  .prow{grid-template-columns:44px minmax(0,1fr);row-gap:6px}
  .prow.head{display:none}
  .prow>:nth-child(n+3){grid-column:2}
  .prow .acts{justify-content:flex-start}
}
/* Fotos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.65);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pcard .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;flex:1}
.pcard .meta strong{font-size:14.5px}
.pcard .acts{display:flex;gap:6px;padding:0 12px 12px}
/* Retos */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.rrow .n{font:800 20px var(--display);color:var(--salmon);text-align:right;font-variant-numeric:tabular-nums}
.rrow input{padding:10px 13px;font-size:15.5px;border-radius:11px}
.rrow .use{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
@media (max-width:620px){.rrow{grid-template-columns:30px minmax(0,1fr) auto}.rrow .use{grid-column:2}}
.row-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-inline input[type=number]{width:90px}
/* Cartel para las mesas */
.poster{position:relative;overflow:hidden;max-width:520px;margin:0 auto;background:var(--cream) url("../images/paper.jpg") center/cover;border:1px solid var(--line);border-radius:8px;padding:40px 30px 34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.poster .kicker::before{display:none}
.poster .branch{width:360px;top:130px;left:-150px;transform:rotate(-80deg)}
.poster>*:not(.branch){position:relative;z-index:1}
.poster .names{font-size:60px;margin:4px 0 0}

<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const CONFIG = {
  novio1: "Sara",
  novio2: "Joshua",
  fecha: "21 de noviembre de 2026",
  lugar: "Finca Gurugú",
  supabaseUrl: "https://kgrtklnkhlqotkpkdmfr.supabase.co",
  supabaseKey: "sb_publishable_93S0dmDPVoOcOHhXzUs-9Q_eXBLpgGb",   // clave pública, segura en el navegador
  urlBase: "https://www.sarajoshua.love/mision/"
};
/* ========================================================= */

/* Modo prueba (?prueba): el juego funciona con datos de ejemplo, aunque esté oculto,
   y no toca la base de datos real. Se mantiene en esta pestaña hasta pulsar «Salir». */
(function(){ try { const q = new URLSearchParams(location.search); if (q.has("prueba")) { if (q.get("prueba") === "0") sessionStorage.removeItem("sj-prueba"); else sessionStorage.setItem("sj-prueba", "1"); } } catch {} })();
const PRUEBA = (() => { try { return sessionStorage.getItem("sj-prueba") === "1"; } catch { return false; } })();
const DEMO = PRUEBA || !/github\.io$|sarajoshua\.love$/.test(location.hostname);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const app = $("#app");
const PAIR = `${CONFIG.novio1}&${CONFIG.novio2}`;
const HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.6 4.5c2.1 0 3.6 1.1 4.4 2.5.8-1.4 2.3-2.5 4.4-2.5 3.6 0 5.7 3.5 4.2 7.1C19.5 16.4 12 21 12 21z"/></svg>`;
const BRANCH = () => `<img class="branch" src="../images/eucalipto.webp" alt="">`;
/* Logo turquesa «Sara + Joshua» */
const WORDMARK = (tag = "h1", cls = "") => `<${tag} class="wm ${cls}"><img src="../images/wordmark.png" alt="Sara + Joshua" width="720" height="379"></${tag}>`;
const LOGO = `<img src="../images/mision-logo.svg" alt="Misión secreta">`;
const PRIZE_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/></svg>`;
const GAMELOGO = `<img class="game-logo" src="../images/mision-logo.svg" alt="" width="64" height="64">`;
const CAM = `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
function base(){ return DEMO ? CONFIG.urlBase : location.origin + location.pathname.replace(/index\.html$/, ""); }
/* Enlace de vuelta a la web de la boda (la misión vive en /mision/) */
const HOME = DEMO ? "../index.html" : "../";
const backBar = (narrow = true) => `<div class="backbar ${narrow ? "guestw" : ""}"><a href="${HOME}"><img src="../images/sj.png" alt="">← Web de la boda</a></div>`;
function ago(ts){
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 45) return "ahora mismo";
  if (s < 3600) return "hace " + Math.round(s / 60) + " min";
  if (s < 86400) return "hace " + Math.round(s / 3600) + " h";
  return new Date(ts).toLocaleDateString("es-ES", { day: "numeric", month: "short" });
}
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar " + src)); document.head.appendChild(s); });
}
const KEY = PRUEBA ? "mision-sj-prueba" : "mision-sj", PKEY = PRUEBA ? "mision-sj-panel-prueba" : "mision-sj-panel";
let memMe = null, memPass = null;
function getPass(){ try { return localStorage.getItem(PKEY) || memPass; } catch { return memPass; } }
function setPass(v){ memPass = v; try { v ? localStorage.setItem(PKEY, v) : localStorage.removeItem(PKEY); } catch {} }
function me(){ try { return JSON.parse(localStorage.getItem(KEY) || "null") || memMe; } catch { return memMe; } }
function remember(v){ memMe = v; try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch {} }

async function compress(file, max = 1600){
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("no es una foto")); i.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement("canvas"); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
}
function armed(btn, fn){
  btn.addEventListener("click", async () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed"); btn.dataset.label = btn.textContent; btn.textContent = "Confirmar";
      setTimeout(() => { if (btn.isConnected && btn.classList.contains("armed") && !btn.disabled) { btn.classList.remove("armed"); btn.textContent = btn.dataset.label; } }, 4000);
      return;
    }
    btn.disabled = true; btn.textContent = "Borrando…";
    try { await fn(); } catch (e) { console.error(e); btn.disabled = false; btn.classList.remove("armed"); btn.textContent = "No se pudo borrar"; }
  });
}

/* =========================================================
   DATOS · Supabase
   ========================================================= */
async function liveStore(){
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js");
  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  const pub = p => sb.storage.from("fotos").getPublicUrl(p).data.publicUrl;
  const E = r => { if (r.error) throw r.error; return r.data; };
  const withUrls = d => ({ ...d, photos: (d.photos || []).map(p => ({ ...p, url: pub(p.path) })) });
  let cache = null, cacheAt = 0;
  const admin = async (fn, args = {}) => {
    const d = E(await sb.rpc(fn, { p_pass: getPass(), ...args }));
    if (d && d.error === "auth") { setPass(null); const e = new Error("auth"); e.auth = true; throw e; }
    if (d && d.error) throw new Error(d.error);
    cache = null;
    return d;
  };
  const data = async () => {
    if (cache && Date.now() - cacheAt < 1500) return cache;
    const d = E(await sb.rpc("admin_data", { p_pass: getPass() }));
    if (d && d.error) { setPass(null); const e = new Error("auth"); e.auth = true; throw e; }
    cache = withUrls(d); cacheAt = Date.now(); return cache;
  };
  const removeFiles = async paths => { if (paths && paths.length) { try { await sb.storage.from("fotos").remove(paths); } catch (e) { console.warn(e); } } };
  return {
    async register(name){ return E(await sb.rpc("register", { p_name: name })); },
    async mine(token){
      const d = E(await sb.rpc("my_mission", { p_token: token }));
      if (!d) return null;
      d.token = token; d.photos = (d.photos || []).map(p => ({ ...p, url: pub(p.path) }));
      return d;
    },
    async addPhoto(m, mission, blob){
      const path = `${m.id}/${Date.now()}-${uid().slice(0, 6)}.jpg`;
      E(await sb.storage.from("fotos").upload(path, blob, { contentType: "image/jpeg" }));
      E(await sb.rpc("add_photo", { p_token: m.token, p_mission: mission, p_path: path }));
    },
    async status(){ return E(await sb.rpc("admin_status")); },
    async setup(pass){ const d = E(await sb.rpc("admin_setup", { p_pass: pass })); if (d.error) throw new Error(d.error); setPass(pass); },
    async login(pass){ const d = E(await sb.rpc("admin_login", { p_pass: pass })); if (d.ok) { setPass(pass); return true; } return false; },
    async logout(){ setPass(null); },
    async players(){ return (await data()).players; },
    async photos(){ return (await data()).photos; },
    async config(){ return (await data()).config; },
    async screenKey(){ return (await data()).screen_key; },
    async saveConfig(retos, n){ await admin("admin_save_config", { p_retos: retos, p_n: n }); },
    async renamePlayer(id, name){ await admin("admin_rename", { p_id: id, p_name: name }); },
    async deletePhoto(ph){ const d = await admin("admin_delete_photo", { p_id: ph.id }); await removeFiles(d.paths); },
    async deletePlayer(id){ const d = await admin("admin_delete_player", { p_id: id }); await removeFiles(d.paths); },
    async setPassword(nw){ await admin("admin_set_password", { p_new: nw }); setPass(nw); },
    async newScreenKey(){ return (await admin("admin_new_screen_key")).screen_key; },
    async reveal(on){ await admin("admin_reveal", { p_on: !!on }); },
    async screen(key){ const d = E(await sb.rpc("screen_data", { p_key: key })); return d ? withUrls(d) : null; }
  };
}

/* =========================================================
   DATOS · vista previa en memoria
   ========================================================= */
function demoStore(){
  const cfg = { retos: RETOS_PROPUESTOS.slice(), retos_por_persona: 10 };
  const pick = card => { const M = cfg.retos.length, n = Math.min(cfg.retos_por_persona, M), s = ((card - 1) * n) % M; return Array.from({ length: n }, (_, j) => (s + j) % M); };
  const fake = seed => {
    const c = document.createElement("canvas"); c.width = c.height = 480; const g = c.getContext("2d");
    const pal = [["#9ED9CF","#4E8C84"],["#F2C3AE","#B8694A"],["#E8DCC8","#8E6C4E"],["#BFE3DC","#2F8F84"],["#F5D9C9","#C98663"]][seed % 5];
    const gr = g.createLinearGradient(0, 0, 480, 480); gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[1]); g.fillStyle = gr; g.fillRect(0, 0, 480, 480);
    for (let i = 0; i < 12; i++) { g.fillStyle = `rgba(255,250,240,${.06 + (i % 4) * .05})`; g.beginPath(); g.arc((seed * 71 + i * 97) % 480, (seed * 37 + i * 53) % 480, 16 + (seed * 13 + i * 29) % 58, 0, 7); g.fill(); }
    g.fillStyle = "rgba(255,255,255,.92)"; g.font = "700 20px Nunito, sans-serif"; g.fillText("foto de ejemplo", 22, 452);
    return c.toDataURL("image/jpeg", .8);
  };
  const players = [], photos = []; let demoReveal = null;
  const names = ["Lucía","Marcos","Tía Carmen","Pablo","Irene","Abuelo Paco","Nerea","Diego","Alba","Hugo"];
  const t0 = Date.now() - 70 * 60000; let seed = 1;
  names.forEach((n, i) => players.push({ id: "p" + i, token: "t" + i, card: i + 1, name: n, missions: pick(i + 1), created_at: new Date(t0 + i * 90000).toISOString() }));
  [10, 9, 8, 7, 6, 5, 3, 2, 1, 0].forEach((k, i) => players[i].missions.slice(0, k).forEach(m => photos.push({ id: uid(), player_id: players[i].id, card: players[i].card, mission: m, mission_text: cfg.retos[m], url: fake(seed++), created_at: new Date(t0 + ((seed * 131) % 60) * 60000).toISOString() })));
  photos.sort((a, b) => a.created_at.localeCompare(b.created_at));
  const emit = () => {};
  return {
    demo: true,
    async register(name){ const card = Math.max(0, ...players.map(p => p.card)) + 1; const p = { id: uid(), token: uid(), card, name, missions: pick(card), created_at: new Date().toISOString() }; players.push(p); emit("players", { new: p }); return { token: p.token, card, name }; },
    async mine(token){ const p = players.find(x => x.token === token); if (!p) return null; return { id: p.id, token, card: p.card, name: p.name, retos: p.missions.map(i => ({ i, text: cfg.retos[i] })), photos: photos.filter(x => x.player_id === p.id) }; },
    async addPhoto(m, mission, blob){ const p = players.find(x => x.id === m.id); const ph = { id: uid(), player_id: p.id, card: p.card, mission, mission_text: cfg.retos[mission], url: URL.createObjectURL(blob), created_at: new Date().toISOString() }; photos.push(ph); emit("photos", { new: ph }); },
    async status(){ return { has_password: true }; },
    async setup(p){ setPass(p); }, async login(p){ setPass(p || "vista-previa"); return true; }, async logout(){ setPass(null); },
    async screenKey(){ return "ejemplo"; }, async newScreenKey(){ return "ejemplo"; }, async setPassword(){},
    async reveal(on){ demoReveal = on ? new Date().toISOString() : null; },
    async screen(){ return { players: players.map(p => ({ ...p })), photos: photos.slice(), config: { retos: cfg.retos.slice(), retos_por_persona: cfg.retos_por_persona }, reveal_at: demoReveal, now: new Date().toISOString() }; },
    async players(){ return players.map(p => ({ ...p })); },
    async photos(){ return photos.slice(); },
    async config(){ return { retos: cfg.retos.slice(), retos_por_persona: cfg.retos_por_persona }; },
    async saveConfig(r, n){ cfg.retos = r.slice(); cfg.retos_por_persona = n; },
    async renamePlayer(id, name){ players.find(p => p.id === id).name = name; },
    async deletePhoto(ph){ const i = photos.findIndex(x => x.id === ph.id); if (i >= 0) photos.splice(i, 1); },
    async deletePlayer(id){ for (let i = photos.length - 1; i >= 0; i--) if (photos[i].player_id === id) photos.splice(i, 1); players.splice(players.findIndex(p => p.id === id), 1); },
    simulate(){
      const cand = []; players.forEach(p => { const done = new Set(photos.filter(x => x.player_id === p.id).map(x => x.mission)); p.missions.forEach(m => { if (!done.has(m)) cand.push([p, m]); }); });
      if (!cand.length) return; const [p, m] = cand[Math.floor(Math.random() * cand.length)];
      const ph = { id: uid(), player_id: p.id, card: p.card, mission: m, mission_text: cfg.retos[m], url: fake(seed++), created_at: new Date().toISOString() };
      photos.push(ph); emit("photos", { new: ph });
    }
  };
}

/* =========================================================
   VISTAS · invitados
   ========================================================= */
let store, cleanup = () => {};

/* =========================================================
   FASES DEL DÍA
   Cada reto empieza por su momento: «Ceremonia · …», «Cóctel · …» o
   «Banquete · …». La lista propuesta va alternando 3 de ceremonia,
   3 de cóctel y 4 de banquete, así cada bloque de 10 retos que recibe
   un invitado tiene de los tres momentos.
   ========================================================= */
const PHASES = [["ceremonia", "Ceremonia"], ["coctel", "Cóctel"], ["banquete", "Banquete"]];
function phaseOf(t){
  const m = String(t || "").match(/^\s*(ceremonia|c[óo]ctel|banquete)\s*[·:\-–—]\s*/i);
  if (!m) return { key: "", label: "", text: String(t || "") };
  const key = m[1].toLowerCase().replace("ó", "o");
  return { key, label: PHASES.find(p => p[0] === key)[1], text: String(t).slice(m[0].length) };
}

const phaseRank = t => { const k = phaseOf(t).key; const i = PHASES.findIndex(p => p[0] === k); return i < 0 ? 9 : i; };

/* =========================================================
   JUEGO OCULTO HASTA QUE LOS NOVIOS LO ACTIVEN
   El estado se guarda en content.json de la web (mision.show),
   el mismo archivo que edita Administración. Para cambiarlo se usa
   el token de GitHub de Administración (si ya se guardó en este
   navegador, no hay que volver a pegarlo).
   ========================================================= */
const GH = { owner: "joshdejuan", repo: "boda-sara-joshua", branch: "main" };
let demoOpen = false, peek = false, gateWanted = null;
async function gameOpen(){
  if (PRUEBA) return true;
  if (DEMO) return demoOpen;
  try {
    const r = await fetch("../content.json?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return true;                       // si no se puede leer, no bloqueamos la boda
    const j = await r.json();
    return !!(j.mision && j.mision.show === true);
  } catch { return true; }
}
function ghToken(){ try { return sessionStorage.getItem("sj_token") || localStorage.getItem("sj_token") || ""; } catch { return ""; } }
function ghSave(t, keep){ try { (keep ? localStorage : sessionStorage).setItem("sj_token", t); } catch {} }
function ghForget(){ try { sessionStorage.removeItem("sj_token"); localStorage.removeItem("sj_token"); } catch {} }
const b64 = str => { const by = new TextEncoder().encode(str); let bin = ""; by.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
const unb64 = t => { const bin = atob(t.replace(/\s/g, "")), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new TextDecoder().decode(a); };
async function gh(method, path, token, payload){
  const r = await fetch("https://api.github.com" + path, { method,
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(payload ? { "Content-Type": "application/json" } : {}) },
    body: payload ? JSON.stringify(payload) : undefined });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error((j && j.message) || "HTTP " + r.status); e.status = r.status; throw e; }
  return j;
}
async function setGameOpen(on, token){
  if (DEMO) { demoOpen = on; return; }
  const path = `/repos/${GH.owner}/${GH.repo}/contents/content.json`;
  const f = await gh("GET", path + "?ref=" + GH.branch, token);
  const j = JSON.parse(unb64(f.content));
  j.mision = { ...(j.mision || {}), show: !!on };
  await gh("PUT", path, token, { message: on ? "Misión secreta: activa el juego" : "Misión secreta: oculta el juego", content: b64(JSON.stringify(j, null, 2) + "\n"), branch: GH.branch, sha: f.sha });
}

async function gateBox(el){
  let open = gateWanted !== null ? gateWanted : await gameOpen();
  const draw = (msg = "", kind = "", askToken = false) => {
    el.className = "gate panel-box" + (open ? " on" : "");
    el.innerHTML = `<div class="gtxt"><strong>${open ? "El juego está abierto" : "El juego está oculto"}</strong>
        <span>${open ? "Los invitados pueden registrarse y subir fotos. La sección se ve en la web." : "Los invitados ven un aviso de que empieza el día de la boda. La sección no aparece en la web."}</span></div>

      ${askToken ? `<form id="g-tok"><input type="password" id="g-token" autocomplete="off" placeholder="Token de GitHub (github_pat_…)" aria-label="Token de GitHub" required>
        <label><input type="checkbox" id="g-keep" checked> Recordar en este navegador</label>
        <button class="small" type="submit">${open ? "Ocultar" : "Activar"}</button></form>` : ""}
      <p class="status ${kind}" id="g-st" aria-live="polite">${esc(msg)}</p>`;
    const go = async (want, token) => {
      const st = $("#g-st"); st.className = "status"; st.textContent = want ? "Activando…" : "Ocultando…";
      el.querySelectorAll("button").forEach(b => b.disabled = true);
      try {
        await setGameOpen(want, token);
        open = want; gateWanted = want;
        draw(store.demo ? "Hecho (vista previa: solo cambia aquí)." : want ? "Activado. La web tarda uno o dos minutos en actualizarse; las páginas que los invitados tengan abiertas se abren solas." : "Oculto. En uno o dos minutos desaparece de la web.", "ok");
      } catch (e) {
        console.error(e);
        if (e.status === 401 || e.status === 403 || e.status === 404) { ghForget(); draw("El token no es válido o no tiene permiso de escritura en " + GH.repo + ". Pega uno nuevo.", "err", true); }
        else draw("No se pudo guardar. Comprueba la conexión e inténtalo otra vez.", "err", !ghToken());
      }
    };
    const ask = want => {
      const t = store.demo ? "vista-previa" : ghToken();
      if (t) return go(want, t);
      draw("Pega el token de GitHub de Administración. Solo se pide una vez por navegador.", "", true);
      $("#g-token").focus();
    };
    const on = $("#g-on"), off = $("#g-off");
    if (on) on.addEventListener("click", () => ask(true));
    if (off) off.addEventListener("click", () => ask(false));
    const tf = $("#g-tok");
    if (tf) tf.addEventListener("submit", e => { e.preventDefault(); const v = $("#g-token").value.trim(); if (!v) return; ghSave(v, $("#g-keep").checked); go(!open, v); });
  };
  draw();
}

function score(players, photos){
  /* Gana quien más retos cumple; si empatan, quien los cumplió antes.
     Cada reto cuenta desde su primera foto, así cambiar una foto después no retrasa a nadie. */
  const map = {}; players.forEach(p => map[p.id] = { p, set: new Set(), first: {}, last: 0, count: 0 });
  photos.forEach(ph => { const s = map[ph.player_id]; if (!s) return; s.count++; if (!s.p.missions.includes(ph.mission)) return;
    s.set.add(ph.mission); const t = new Date(ph.created_at).getTime(); if (!(ph.mission in s.first) || t < s.first[ph.mission]) s.first[ph.mission] = t; });
  Object.values(map).forEach(s => { s.last = Math.max(0, ...Object.values(s.first)); });
  return map;
}

    $("#stats").innerHTML = `<div class="stat"><b>${players.length}</b><span>participantes</span></div><div class="stat"><b>${photos.length}</b><span>fotos</span></div><div class="stat"><b>${Object.values(sc).reduce((a, s) => a + s.set.size, 0)}</b><span>retos cumplidos</span></div>`;
    $("#rank").innerHTML = list.length ? list.map((s, i) => `<li class="${bump === s.p.id ? "bump" : ""}"><span class="pos">${i + 1}</span><span class="who">${esc(s.p.name)}<small>Misión Nº ${pad(s.p.card)}</small></span>
      <span class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k < s.set.size ? "on" : ""}"></i>`).join("")}<b>${s.set.size}</b></span></li>`).join("")
      : `<li><span></span><span class="muted">Todavía nadie se ha registrado.</span><span></span></li>`;
    const caught = new Set(photos.map(p => p.mission));
    const pend = cfg.retos.map((t, i) => [t, i]).filter(([, i]) => !caught.has(i));
    $("#pend").innerHTML = pend.length ? pend.slice(0, 12).map(([t]) => `<span>${esc(plain(t))}</span>`).join("") + (pend.length > 12 ? `<span>y ${pend.length - 12} más</span>` : "") : `<span>¡Todos cazados!</span>`;
    const rec = photos.slice().reverse(), top = (showId && photos.find(p => p.id === showId)) || rec[0];
    const key = top ? top.id + "|" + ago(top.created_at) : "vacio";
    if (key !== spotKey) { spotKey = key; $("#spot").innerHTML = top ? `<img src="${esc(top.url)}" alt=""><div class="cap"><strong>${esc(top.mission_text || cfg.retos[top.mission] || "")}</strong><span>${esc(byId[top.player_id]?.name || "")} · ${ago(top.created_at)}</span></div>`
      : `<div class="empty">Las fotos aparecerán aquí en cuanto alguien cumpla un reto.</div>`; }
    $("#feed").innerHTML = rec.slice(1, 13).map(ph => `<figure><img src="${esc(ph.url)}" alt="" loading="lazy"><figcaption>${esc(byId[ph.player_id]?.name || "")}</figcaption></figure>`).join("");
  };
  render();
  let alive = true, busy = false, lastNewAt = Date.now(), cycle = [];
  const rotate = () => {
    if (!alive || document.hidden || d.photos.length < 2 || Date.now() - lastNewAt < 25000) return;
    if (!cycle.length) cycle = d.photos.map(p => p.id).filter(id => id !== showId).sort(() => Math.random() - .5);
    showId = cycle.shift(); render();
  };
  const rot = setInterval(rotate, 9000);
  const tick = async () => {
    if (!alive || busy || document.hidden) return; busy = true;
    try {
      if (store.demo) store.simulate();
      const nd = await load(); if (!alive) return;
      const newest = nd.photos.length ? nd.photos[nd.photos.length - 1] : null;
      const isNew = newest && newest.id !== lastId;
      if (isNew) { lastId = newest.id; bump = newest.player_id; showId = null; lastNewAt = Date.now(); cycle = []; }
      d = nd; render(); if (isNew) flash();
    } catch (e) { if (e.auth) { alive = false; loginNote = "Vuelve a entrar."; viewLogin(); } }
    finally { busy = false; }
  };
  const poll = setInterval(tick, store.demo ? 7000 : 6000);
  $("#fs").addEventListener("click", async () => { try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch {} });
  let lock = null; try { lock = await navigator.wakeLock?.request("screen"); } catch {}
  cleanup = () => { alive = false; clearInterval(poll); clearInterval(rot); try { lock?.release(); } catch {} };
}

/* =========================================================
   GANADOR · momento sorpresa
   ========================================================= */
function ranking(d){
  const sc = score(d.players, d.photos);
  return Object.values(sc).filter(s => s.set.size > 0).sort((a, b) => b.set.size - a.set.size || a.last - b.last);
}
const wait = ms => new Promise(r => setTimeout(r, ms));
let revealOpen = null;

function sound(){
  let ctx = null;
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return { roll(){}, crash(){}, stop(){} }; }
  const noise = (dur, gain, freq) => {
    try {
      const len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = freq > 3000 ? "highpass" : "bandpass"; f.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = gain;
      src.connect(f).connect(g).connect(ctx.destination); src.start();
    } catch {}
  };
  let timer = null;
  return {
    roll(ms){ const end = Date.now() + ms; let v = .12; timer = setInterval(() => { if (Date.now() > end) return clearInterval(timer); v = Math.min(.5, v + .01); noise(.08, v, 180); }, 55); },
    crash(){ clearInterval(timer); noise(2.2, .5, 5000); noise(.5, .9, 90); },
    stop(){ clearInterval(timer); try { ctx.close(); } catch {} }
  };
}

function confetti(canvas){
  const g = canvas.getContext("2d"), cols = ["#23C4B3", "#3FD8C8", "#EC8F6E", "#E3B893", "#F6EFE6", "#F2A185"];
  let W, H, parts = [], raf = null, until = 0;
  const size = () => { W = canvas.width = canvas.clientWidth * devicePixelRatio; H = canvas.height = canvas.clientHeight * devicePixelRatio; };
  size(); addEventListener("resize", size);
  const burst = (x, y, n, spread, up) => { for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * spread; const v = (up || 14) * (0.5 + Math.random()) * devicePixelRatio; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: (6 + Math.random() * 8) * devicePixelRatio, h: (8 + Math.random() * 12) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[i % cols.length], leaf: Math.random() < .25 }); } };
  const step = () => {
    g.clearRect(0, 0, W, H);
    if (Date.now() < until && Math.random() < .5) { const x = Math.random() * W; parts.push({ x, y: -20, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, w: 8 * devicePixelRatio, h: 12 * devicePixelRatio, r: 0, vr: (Math.random() - .5) * .2, c: cols[Math.floor(Math.random() * cols.length)], leaf: Math.random() < .3 }); }
    parts = parts.filter(p => p.y < H + 60);
    for (const p of parts) {
      p.vy += .22 * devicePixelRatio; p.vx *= .99; p.vy *= .99; p.x += p.vx + Math.sin(p.y / 40) * .6; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
      if (p.leaf) { g.beginPath(); g.ellipse(0, 0, p.w * .7, p.h * .45, 0, 0, 7); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * .5);
      g.restore();
    }
    raf = requestAnimationFrame(step);
  };
  step();
  return {
    fire(){ burst(W * .1, H, 140, 1.1, 22); burst(W * .9, H, 140, 1.1, 22); burst(W / 2, H * .45, 120, 6.3, 12); until = Date.now() + 7000; },
    stop(){ cancelAnimationFrame(raf); removeEventListener("resize", size); }
  };
}

async function playReveal(d, opts = {}){
  if (revealOpen) revealOpen.close();
  const rank = ranking(d), winner = rank[0];
  const el = document.createElement("div");
  el.className = "reveal"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Ganador de la misión secreta");
  el.innerHTML = `<canvas></canvas><img class="rv-branch l" src="../images/eucalipto.webp" alt=""><img class="rv-branch r" src="../images/eucalipto.webp" alt="">
    <div class="rv-stage"><p class="rv-kicker">Misión secreta · ${esc(PAIR)}</p>
      <h2 class="rv-title">${winner ? "Y el mejor fotógrafo encubierto es…" : "Todavía nadie ha cumplido ningún reto"}</h2>
      <div class="rv-slot" aria-live="polite"></div><p class="rv-meta"></p><div class="rv-photos"></div><div class="rv-podium"></div></div>
    <button class="rv-close" type="button">Cerrar</button>`;
  document.body.appendChild(el);
  let alive = true;
  const fx = confetti(el.querySelector("canvas")), snd = opts.sound ? sound() : null;
  const close = () => { if (!alive) return; alive = false; fx.stop(); snd?.stop(); el.style.transition = "opacity .5s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 500); revealOpen = null; };
  revealOpen = { close };
  el.querySelector(".rv-close").addEventListener("click", () => { close(); opts.onClose?.(); });
  if (!winner) return;
  const slot = el.querySelector(".rv-slot");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  await wait(1800);
  if (!reduce) {
    for (const n of ["3", "2", "1"]) { if (!alive) return; slot.innerHTML = `<span class="rv-count">${n}</span>`; await wait(950); }
    const names = d.players.map(p => p.name).filter(Boolean);
    snd?.roll(3600);
    let delay = 55; const start = Date.now();
    while (alive && Date.now() - start < 3600) { slot.innerHTML = `<span class="rv-spin">${esc(names[Math.floor(Math.random() * names.length)])}</span>`; await wait(delay); delay = Math.min(420, delay * 1.09); }
  }
  if (!alive) return;
  snd?.crash();
  slot.innerHTML = `<span class="rv-name">${esc(winner.p.name)}</span>`;
  fx.fire();
  const meta = el.querySelector(".rv-meta");
  const hora = winner.last ? new Date(winner.last).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" }) : "";
  meta.textContent = winner.set.size === winner.p.missions.length
    ? `Primero en completar los ${winner.set.size} retos${hora ? " · a las " + hora : ""}`
    : `${winner.set.size} de ${winner.p.missions.length} retos cumplidos${hora ? " · el último a las " + hora : ""}`;
  await wait(900); meta.classList.add("on");
  /* Retos que ha cumplido, uno a uno, para comentarlos */
  const retosTxt = (d.config && d.config.retos) || [];
  const last = {}; d.photos.forEach(p => { if (p.player_id === winner.p.id && winner.p.missions.includes(p.mission)) last[p.mission] = p; });
  const done = winner.p.missions.filter(m => last[m]).map(m => { const ph = last[m], t = ph.mission_text || retosTxt[m] || ""; return { ph, f: phaseOf(t), r: phaseRank(t) }; }).sort((a, b) => a.r - b.r);
  el.querySelector(".rv-photos").innerHTML = done.slice(0, 5).map((x, i) => `<img src="${esc(x.ph.url)}" alt="" style="animation-delay:${i * .25}s">`).join("");
  await wait(2600 + Math.min(5, done.length) * 250);
  if (!alive || !done.length) return;
  el.classList.add("gal");
  el.querySelector(".rv-photos").innerHTML = "";
  const g = document.createElement("div"); g.className = "rv-gal";
  g.innerHTML = `<figure class="rv-shot"><img alt=""><figcaption><span class="rv-ph"></span><strong></strong></figcaption></figure>
    <div class="rv-nav"><button type="button" class="rv-prev" aria-label="Reto anterior">←</button><div class="rv-thumbs">${done.map((x, i) => `<button type="button" data-i="${i}" aria-label="Reto ${i + 1}"><img src="${esc(x.ph.url)}" alt=""></button>`).join("")}</div><button type="button" class="rv-next" aria-label="Reto siguiente">→</button></div>`;
  el.querySelector(".rv-stage").insertBefore(g, el.querySelector(".rv-podium"));
  let cur = -1, auto = null;
  const show = i => {
    cur = (i + done.length) % done.length; const x = done[cur];
    const im = g.querySelector(".rv-shot img"); im.classList.remove("in"); void im.offsetWidth; im.src = x.ph.url; im.classList.add("in");
    g.querySelector(".rv-ph").textContent = (x.f.label ? x.f.label + " · " : "") + `reto ${cur + 1} de ${done.length}`;
    g.querySelector("figcaption strong").textContent = x.f.text;
    g.querySelectorAll(".rv-thumbs button").forEach((b, k) => b.setAttribute("aria-current", k === cur ? "true" : "false"));
  };
  const play = () => { clearInterval(auto); auto = setInterval(() => { if (alive) show(cur + 1); else clearInterval(auto); }, 9000); };
  g.querySelector(".rv-prev").addEventListener("click", () => { show(cur - 1); play(); });
  g.querySelector(".rv-next").addEventListener("click", () => { show(cur + 1); play(); });
  g.querySelectorAll(".rv-thumbs button").forEach(b => b.addEventListener("click", () => { show(+b.dataset.i); play(); }));
  const key = e => { if (!alive) return removeEventListener("keydown", key); if (e.key === "ArrowRight") { show(cur + 1); play(); } if (e.key === "ArrowLeft") { show(cur - 1); play(); } };
  addEventListener("keydown", key);
  show(0); play();
  const pod = rank.slice(1, 3);
  if (pod.length) { const po = el.querySelector(".rv-podium"); po.innerHTML = pod.map((s, i) => `<span><b>${i + 2}º</b>${esc(s.p.name)} · ${s.set.size} retos</span>`).join(""); await wait(1200); po.classList.add("on"); }
}

async function tabWinner(el){
  const d = await (async () => { const [players, photos, config] = await Promise.all([store.players(), store.photos(), store.config()]); return { players, photos, config }; })();
  const rank = ranking(d);
  el.innerHTML = `<div class="section-title"><h2>Desvelar al ganador</h2></div>
    <div style="display:grid;gap:18px;max-width:760px">
    <div class="panel-box" style="display:flex;flex-direction:column;gap:14px">
      <p style="margin:0">Lanza el momento sorpresa: cuenta atrás, nombres girando como una ruleta y el ganador con confeti y sus fotos. Gana el primero que completa todos sus retos. Si nadie los completa, gana quien más haya cumplido y, si empatan, quien llegó antes a esa cifra.</p>
      <div class="win-actions">
        <button id="rv-screen">Desvelar en la pantalla en directo</button>
        <button class="ghost" id="rv-here">Desvelar en este dispositivo</button>
        <button class="ghost small" id="rv-off">Quitar de la pantalla</button>
      </div>
      <p class="muted" style="margin:0;font-size:14px">"En la pantalla en directo" aparece en unos segundos en el ordenador del proyector que tenga abierto el enlace de la pantalla. "En este dispositivo" lo reproduce aquí mismo, con sonido de redoble.</p>
      <div class="status" id="rv-st"></div>
    </div>
    <details class="panel-box peek"><summary>Ver el podio antes (sin sorpresa)</summary>
      ${rank.length ? `<ol class="win-list">${rank.slice(0, 5).map((s, i) => `<li><b>${i + 1}º</b><span>${esc(s.p.name)}</span><span class="muted" style="margin-left:auto">${s.set.size}/${s.p.missions.length} retos · ${s.count} fotos</span></li>`).join("")}</ol>` : `<p class="muted">Todavía nadie ha cumplido ningún reto.</p>`}
    </details></div>`;
  const st = $("#rv-st");
  $("#rv-here").addEventListener("click", () => playReveal(d, { sound: true }));
  $("#rv-screen").addEventListener("click", async () => {
    st.className = "status"; st.textContent = "Enviando a la pantalla…";
    try { await store.reveal(true); st.className = "status ok"; st.textContent = "¡En marcha! La pantalla lo mostrará en unos segundos."; }
    catch (e) { st.className = "status err"; st.textContent = "No se pudo enviar. Inténtalo otra vez."; }
  });
  $("#rv-off").addEventListener("click", async () => {
    try { await store.reveal(false); st.className = "status ok"; st.textContent = "Quitado de la pantalla."; }
    catch { st.className = "status err"; st.textContent = "No se pudo quitar. Inténtalo otra vez."; }
  });
}

/* =========================================================
   RUTAS
   ========================================================= */
async function route(){
  cleanup(); cleanup = () => {};
  if (revealOpen) revealOpen.close();
  const tok = location.hash.match(/^#m-([0-9a-z-]{8,})$/i);
  if (tok) {
    const d = await store.mine(tok[1]).catch(() => null);
    if (d) remember({ token: tok[1], card: d.card, name: d.name });
    history.replaceState(null, "", location.pathname + "#mision");
  }
  window.scrollTo(0, 0);
  try {
    const path = location.hash.replace(/^#/, "").split("?")[0];
    const forGuests = !(path === "admin" || path.startsWith("admin/") || path.startsWith("pantalla"));
    if (forGuests && !peek && !(await gameOpen())) return viewLocked();
    if (path === "mision") await viewMission();
    else if (path === "admin" || path.startsWith("admin/")) await viewAdmin(path.split("/")[1]);
    else if (path === "pantalla" && store.demo) await viewScreen("ejemplo");
    else if (path.startsWith("pantalla-")) await viewScreen(path.slice(9));
    else viewHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<main class="guest"><div class="sheet"><h1 class="names" style="font-size:40px">Algo ha fallado</h1><p>No hay conexión. Recarga la página en unos segundos.</p></div></main>`;
  }
}

(async () => {
  try { store = DEMO ? demoStore() : await liveStore(); }
  catch (e) { app.innerHTML = `<main class="guest"><div class="sheet"><h1 class="names" style="font-size:40px">Sin conexión</h1><p>Comprueba la cobertura y recarga la página.</p></div></main>`; return; }
  window.addEventListener("hashchange", route);
  route();
})();
