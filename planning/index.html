<style>
/* Layout: portada a sangre con carrusel de fotos y tarjeta de cristal; secciones asimétricas sobre papel kraft con focos de color detrás de paneles de cristal; menú flotante inferior. Paleta de la pareja: #ec8f6e, #41e0cf, #895129. */
:root {
  --paper: #F3EEE5;
  --brown: #895129;
  --brown-deep: #3B2210;
  --coral: #EC8F6E;
  --teal: #41E0CF;
  --cream: #F9F4EC;
  --muted: #7A5236;
  --line: rgba(137, 81, 41, .3);
  --font-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter: 20px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background-color: var(--paper); color: var(--brown);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none; background: url("../images/paper.jpg") center / cover no-repeat; }
body.admin-open { overflow: hidden; }
a { color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: 1080px; margin-inline: auto; padding-inline: var(--gutter); }
p { margin: 0 0 1rem; max-width: 58ch; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
.eyebrow { display: flex; align-items: center; gap: .8rem; font-size: .78rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; margin: 0 0 1.1rem; }
.eyebrow::before { content: ""; width: 34px; height: 2px; background: var(--coral); flex: none; }
h2.title { font-weight: 700; font-size: clamp(2.2rem, 5.6vw, 3.5rem); line-height: 1.02; letter-spacing: -.025em; margin-bottom: 1.5rem; text-wrap: balance; }

/* Focos de color detrás del cristal */
.orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.orbs i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }
.orbs i:nth-child(1) { width: 46vmax; height: 46vmax; left: -14vmax; top: 18vh; background: var(--teal); animation: drift1 26s ease-in-out infinite alternate; }
.orbs i:nth-child(2) { width: 40vmax; height: 40vmax; right: -12vmax; top: 48vh; background: var(--coral); animation: drift2 31s ease-in-out infinite alternate; }
.orbs i:nth-child(3) { width: 30vmax; height: 30vmax; left: 34vw; top: -8vh; background: #F3C77A; opacity: .4; animation: drift3 23s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(14vw, -12vh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vw, -16vh) scale(.9); } }
@keyframes drift3 { to { transform: translate(10vw, 30vh) scale(1.2); } }

/* Cristal líquido */
.glass {
  position: relative; isolation: isolate; border-radius: 28px; color: var(--brown-deep);
  background: linear-gradient(140deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, .22));
  -webkit-backdrop-filter: blur(22px) saturate(1.9); backdrop-filter: blur(22px) saturate(1.9);
  border: 1px solid rgba(255, 255, 255, .6);
  box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .85), inset 0 -2px 6px rgba(255, 255, 255, .25), inset 0 0 22px rgba(255, 255, 255, .12), 0 24px 50px -12px rgba(59, 34, 16, .28);
}
.glass::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  background: linear-gradient(118deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .05) 34%, rgba(255, 255, 255, 0) 62%, rgba(255, 255, 255, .26)); }
.glass::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(260px circle at var(--mx, 25%) var(--my, 0%), rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 65%); }
.glass:hover::after { opacity: 1; }
.glass.dark { color: #fff; background: linear-gradient(140deg, rgba(59, 34, 16, .46), rgba(59, 34, 16, .3)); border-color: rgba(255, 255, 255, .42);
  box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .55), inset 0 -2px 6px rgba(255, 255, 255, .12), 0 24px 50px -12px rgba(0, 0, 0, .45); }
.glass.dark::before { background: linear-gradient(118deg, rgba(255, 255, 255, .32), rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0) 64%, rgba(255, 255, 255, .14)); }
.panel { padding: clamp(1.4rem, 3.4vw, 2.3rem); }

/* Botones */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  font: inherit; font-size: .92rem; font-weight: 700; letter-spacing: .02em; cursor: pointer; text-align: center; text-decoration: none;
  padding: .8rem 1.4rem; border-radius: 999px; color: var(--brown-deep); border: 1px solid rgba(255, 255, 255, .7);
  background: linear-gradient(180deg, rgba(150, 245, 234, .98), rgba(65, 224, 207, .92));
  box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .85), inset 0 -2px 4px rgba(20, 130, 118, .18), 0 10px 22px -6px rgba(65, 224, 207, .65);
  transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s, background .25s;
}
.btn svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
.btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .9), inset 0 -2px 4px rgba(20, 130, 118, .18), 0 16px 28px -8px rgba(65, 224, 207, .8); }
.btn.line {
  color: var(--brown); border-color: rgba(255, 255, 255, .65); background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .22));
  -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6);
  box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .85), 0 8px 18px -8px rgba(59, 34, 16, .3);
}
.btn.line:hover { background: linear-gradient(180deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .4)); }
.hero .btn.line { color: #fff; border-color: rgba(255, 255, 255, .5); background: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .08)); box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .5), 0 8px 18px -8px rgba(0, 0, 0, .4); }
.hero .btn.line:hover { background: rgba(255, 255, 255, .38); }
.btns { display: flex; flex-wrap: wrap; gap: .7rem; }
.btn:active { transform: scale(.97); }

/* Portada */
.hero { position: relative; isolation: isolate; overflow: hidden; color: #fff; background: #3B2210;
  min-height: clamp(560px, 100svh, 1600px); display: flex; flex-direction: column; padding-block: clamp(18px, 4vh, 44px) 112px; }
.slides { position: absolute; inset: 0; z-index: -3; }
.slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(1.1) saturate(1.06); opacity: 0; transform: scale(1.08); transition: opacity 1.5s ease, transform 10s ease-out; }
.slide.on { opacity: 1; transform: scale(1); }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background: linear-gradient(180deg, rgba(30, 14, 4, .32) 0%, rgba(30, 14, 4, 0) 30%, rgba(30, 14, 4, 0) 55%, rgba(30, 14, 4, .5) 100%); }
/* Light leaks: destellos de luz con los colores de la web */
.leaks { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; mix-blend-mode: screen; }
.leaks i { position: absolute; border-radius: 50%; filter: blur(30px); opacity: 0; will-change: transform, opacity; animation: leak 16s ease-in-out infinite; }
.leaks i:nth-child(1) { width: 75vmax; height: 50vmax; left: -30vmax; top: -18vmax; background: radial-gradient(closest-side, rgba(236, 143, 110, 1) 25%, rgba(236, 143, 110, 0)); animation-duration: 9s; }
.leaks i:nth-child(2) { width: 62vmax; height: 42vmax; right: -26vmax; top: 6%; background: radial-gradient(closest-side, rgba(65, 224, 207, 1) 25%, rgba(65, 224, 207, 0)); animation-duration: 12s; animation-delay: -5s; }
.leaks i:nth-child(3) { width: 58vmax; height: 36vmax; left: 12%; bottom: -24vmax; background: radial-gradient(closest-side, rgba(243, 182, 94, 1) 25%, rgba(243, 182, 94, 0)); animation-duration: 10s; animation-delay: -6s; }
.leaks i:nth-child(4) { width: 130vmax; height: 13vmax; left: -20vmax; top: 34%; border-radius: 50%; rotate: -16deg; filter: blur(32px); background: linear-gradient(90deg, rgba(255, 214, 170, 0), rgba(255, 220, 180, 1) 40%, rgba(236, 143, 110, .9) 60%, rgba(236, 143, 110, 0)); animation-duration: 13s; animation-delay: -3s; }
.leaks i:nth-child(5) { width: 40vmax; height: 40vmax; right: 8%; bottom: -12vmax; background: radial-gradient(closest-side, rgba(236, 143, 110, 1) 25%, rgba(236, 143, 110, 0)); animation-duration: 11s; animation-delay: -12s; }
@keyframes leak {
  0% { opacity: 0; transform: translate3d(-18%, -6%, 0) scale(.9); }
  20% { opacity: 1; transform: translate3d(2%, 10%, 0) scale(1.1); }
  45% { opacity: .75; transform: translate3d(22%, -8%, 0) scale(1.28); }
  70% { opacity: 1; transform: translate3d(10%, 14%, 0) scale(1.05); }
  100% { opacity: 0; transform: translate3d(-12%, 4%, 0) scale(.92); }
}
.hero-inner { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 2rem; }
.brand { position: relative; align-self: center; width: min(300px, 78vw); }
.hero-bottom { display: grid; gap: .9rem; justify-items: start; }
@media (min-width: 900px) { .brand { align-self: flex-start; width: clamp(250px, 21vw, 340px); margin-top: .25rem; margin-left: calc(-1 * max(0px, (100vw - 1080px) / 2)); } }
.chip { display: inline-flex; padding: .5rem 1.1rem; border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
/* Logo: letras de cristal líquido ya pintadas en la imagen, sin forma de fondo */
.logo-glass { position: relative; width: 100%; margin: 0; animation: pop 1.1s cubic-bezier(.2, .7, .2, 1) .1s both; }
.logo-glass img { display: block; width: 112.5%; height: auto; max-width: none; margin: -6.25% 0 -6.25% -6.25%; }
.hero-branch { position: absolute; z-index: 2; left: 61%; top: 9.5%; width: 42%; height: auto; pointer-events: none; transform: rotate(3deg); transform-origin: 0% 45%; animation: sway-soft 9s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .3)); }
@keyframes sway-soft { 0%, 100% { rotate: -1.2deg; } 50% { rotate: 1.2deg; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
.hero-card { width: 100%; max-width: 540px; padding: 1.3rem 1.5rem 1.5rem; display: grid; gap: 1.1rem; }
.when { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.25rem, 3vw, 1.6rem); line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.when span { display: block; font-family: var(--font-body); font-weight: 400; font-size: .95rem; opacity: .92; margin-top: .3rem; letter-spacing: 0; }
.count { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
.count div { padding-left: .8rem; border-left: 1.5px solid rgba(255, 255, 255, .55); }
.count strong { display: block; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.9rem, 6vw, 2.7rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.count span { font-size: .68rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .9; }
.count-done { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; margin: 0; color: var(--teal); }
.dots { position: absolute; z-index: 3; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; }
.dots button { width: 28px; min-height: 28px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.dots button::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .7); box-shadow: 0 1px 6px rgba(0, 0, 0, .35); transition: height .35s, background .35s; }
.dots button[aria-current="true"]::before { height: 28px; background: var(--teal); }

/* Bloques */
section.block { padding-block: clamp(3.5rem, 9vw, 6.5rem); }
.two { display: grid; gap: clamp(2rem, 5vw, 4rem); grid-template-columns: minmax(0, 1fr); }
.two > * { min-width: 0; }
@media (min-width: 820px) { .two { grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); align-items: center; } }
.bigdate { font-family: var(--font-display); line-height: .8; margin: 0 0 1.6rem; max-width: none; }
.bigdate .d { display: block; font-size: clamp(7rem, 22vw, 12rem); font-weight: 800; color: var(--coral); letter-spacing: -.06em; font-variant-numeric: lining-nums; }
.bigdate .m { display: block; font-weight: 600; font-size: clamp(1.7rem, 4.6vw, 2.5rem); margin-top: .8rem; letter-spacing: -.02em; }
.bigdate .h { display: block; font-family: var(--font-body); font-size: .92rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; margin-top: 1rem; }
.place-label { font-size: .78rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 .4rem; }
.place-name { font-weight: 700; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.05; letter-spacing: -.025em; margin-bottom: .9rem; }
address { font-style: normal; margin-bottom: 1.5rem; color: var(--muted); }
.painting { margin: 0; }
.painting img { width: 100%; height: auto; transform: rotate(-1.5deg); filter: drop-shadow(0 18px 24px rgba(137, 81, 41, .2)); transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
.painting:hover img { transform: rotate(0deg) scale(1.02); }
.copied { font-size: .88rem; font-weight: 700; margin: .7rem 0 0; min-height: 1.4em; max-width: none; }
@keyframes sway { 0%, 100% { rotate: -2.5deg; } 50% { rotate: 2.5deg; } }

/* Programa */
.timeline { --tc: 4.6rem; --dc: 3rem; --cg: 1rem; list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; display: grid; grid-template-columns: var(--tc) var(--dc) minmax(0, 1fr); column-gap: var(--cg); align-items: center; padding-block: 1.3rem; }
.timeline li::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--tc) + var(--cg) + var(--dc) / 2); width: 1.5px; background: var(--line); transform: translateX(-50%); }
.timeline li:first-child::before { top: 50%; }
.timeline li:last-child::before { bottom: 50%; }
.timeline .dot { position: relative; z-index: 1; justify-self: center; width: 13px; height: 13px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 5px rgba(255, 255, 255, .6), 0 0 0 6.5px var(--brown); }
.timeline time { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-align: right; }
.timeline h3 { font-weight: 600; font-size: clamp(1.2rem, 3vw, 1.65rem); line-height: 1.2; letter-spacing: -.015em; }

.sched-empty { margin: 0; max-width: 34ch; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.2rem, 3vw, 1.5rem); line-height: 1.3; letter-spacing: -.01em; color: var(--brown-deep); }

/* Alojamiento */
.tag { display: inline-block; font-size: .76rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brown-deep); padding: .4rem 1rem; border-radius: 999px; margin-bottom: 1.2rem;
  background: linear-gradient(180deg, rgba(150, 245, 234, .98), rgba(65, 224, 207, .9)); border: 1px solid rgba(255, 255, 255, .7); box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .85); }
.tip { border-left: 3px solid var(--coral); padding-left: 1rem; color: var(--muted); max-width: 52ch; margin-bottom: 1.6rem; }
.tip:empty { display: none; }

footer { background: var(--brown); color: var(--cream); padding-block: 2.6rem 8.5rem; }
footer .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
footer .mono { display: block; height: 46px; width: auto; }
footer p { margin: 0; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
footer a.adm { font-size: .78rem; letter-spacing: .08em; opacity: .7; text-decoration: none; border-bottom: 1px solid rgba(249, 244, 236, .4); }
footer a.adm:hover { opacity: 1; }

/* Menú inferior */
.dock { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; gap: .2rem; padding: 6px; border-radius: 999px; max-width: calc(100% - 24px); }
.dock a { display: flex; align-items: center; gap: 0; padding: .62rem .8rem; border-radius: 999px; text-decoration: none; font-size: .86rem; font-weight: 700; letter-spacing: .02em; color: var(--brown-deep);
  transition: background .3s, box-shadow .3s, gap .3s; }
.dock svg { width: 21px; height: 21px; fill: currentColor; flex: none; }
.dock a span { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .35s ease, opacity .25s; }
.dock a.on { gap: .5rem; background: linear-gradient(180deg, rgba(150, 245, 234, .98), rgba(65, 224, 207, .92)); box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .85), inset 0 -2px 4px rgba(20, 130, 118, .18), 0 6px 14px -4px rgba(65, 224, 207, .7); }
.dock a:active { transform: scale(.95); }
.dock a.dock-logo { padding: .3rem .8rem .3rem .7rem; margin-right: .2rem; border-right: 1px solid rgba(137, 81, 41, .2); border-radius: 999px 0 0 999px; }
.dock a.dock-logo:hover { background: none; }
.dock-logo img { display: block; height: 26px; width: auto; filter: drop-shadow(0 1px 1.5px rgba(59, 34, 16, .45)); }
.dock a.on span { max-width: 9rem; opacity: 1; }
.dock a:hover:not(.on) { background: rgba(255, 255, 255, .45); }
@media (min-width: 700px) { .dock a { gap: .5rem; padding: .62rem 1.05rem; } .dock a span { max-width: 9rem; opacity: 1; } }
body.admin-open .dock { display: none; }

/* Entrada al hacer scroll */
.rv { transition: opacity .9s ease, transform .9s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--d, 0ms); }
html.js .rv:not(.in) { opacity: 0; transform: translateY(24px); }

@media (max-width: 520px) {
  .hero { padding-block: 18px 104px; }
  .hero-card .when { font-size: 1.1rem; }
  .count strong { font-size: 1.75rem; }
  .dock a.dock-logo { padding: .3rem .6rem .3rem .55rem; }
  .dock a:not(.dock-logo) { padding: .6rem .6rem; }
  .hero-card { padding: 1.1rem 1.1rem 1.3rem; }
  .timeline { --tc: 3.7rem; --dc: 2.4rem; --cg: .8rem; }
  .timeline time { font-size: 1.3rem; }
  .dots { right: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .slide { transition: opacity .3s; transform: none; }
  .hero-branch, .orbs i, .logo-glass { animation: none; }
  .leaks i { animation: none; opacity: .6; }
  .rv, .btn, .painting img, .dock a, .dock a span { transition: none; }
}

/* ---------- Administración ---------- */
.admin { position: fixed; z-index: 90; top: 12px; right: 12px; bottom: 12px; width: min(500px, calc(100% - 24px)); display: none; flex-direction: column; overflow: hidden;
  background: linear-gradient(150deg, rgba(249, 244, 236, .86), rgba(249, 244, 236, .66)); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); }
.admin.open { display: flex; }
.ad-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: 1rem 1.2rem .6rem; }
.ad-head h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
.ad-head small { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); }
.ad-dirty { color: #B24A1F; }
.ad-body { flex: 1; overflow-y: auto; padding: .4rem 1.2rem 1rem; overscroll-behavior: contain; }
.ad-foot { padding: .8rem 1.2rem 1rem; border-top: 1px solid var(--line); display: grid; gap: .6rem; }
.ad-foot .btns { flex-wrap: nowrap; }

      var d = String(p[1] || '').replace(/\D/g, ''); if (d.length === 9 && /^[6789]/.test(d)) d = '34' + d; return [p[0], d];
    }).filter(function (p) { return p[1].length >= 8; }).map(function (p) {
      return '<a class="btn" href="https://wa.me/' + p[1] + (msg ? '?text=' + encodeURIComponent(msg) : '') + '" target="_blank" rel="noopener">WhatsApp ' + esc(p[0]) + '</a>';
    }).join('');
  }

  function dishHtml(it, sel, any, cnt, pend) {
    if (pend === 'none') return '<li class="dish"><div class="dish-main">' + (it.detail ? '<span class="dish-detail">' + esc(it.detail) + '</span>' : '') + '<span class="dish-name">' + esc(it.name) + '</span></div></li>';
    if (pend) return '<li class="dish"><div class="dish-main">' + (it.detail ? '<span class="dish-detail">' + esc(it.detail) + '</span>' : '') + '<span class="dish-name">' + esc(it.name) + '</span></div><div class="al-chips"><span class="al tbd">Alérgenos por confirmar</span></div></li>';
    var al = it.allergens || [];
    var hit = sel.filter(function (k) { return al.indexOf(k) >= 0; });
    var cls = sel.length && any ? (hit.length ? ' warn' : ' ok') : '';
    if (sel.length && any) { if (hit.length) cnt.risky++; else cnt.safe++; }
    return '<li class="dish' + cls + '"><div class="dish-main">' + (it.detail ? '<span class="dish-detail">' + esc(it.detail) + '</span>' : '') +
      '<span class="dish-name">' + esc(it.name) + '</span></div>' +
      (al.length ? '<div class="al-chips">' + al.map(function (k) { return '<span class="al' + (hit.indexOf(k) >= 0 ? ' hit' : '') + '">' + esc(LABEL[k] || k) + '</span>'; }).join('') + '</div>'
        : (any ? '<div class="al-chips"><span class="al none">Sin alérgenos declarados</span></div>' : '')) + '</li>';
  }

  /* Misión secreta (solo cuando los novios activan el juego) y canción de la ceremonia */
  var CAM = '<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  var NOTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';
  function extrasHtml(b) {
    var out = '';
    var mi = data.mision || {};
    if (b.mision && mi.show === true) {
      var yo = null; try { yo = JSON.parse(localStorage.getItem('mision-sj') || 'null'); } catch (e) {}
      out += '<div class="tb-extra mis"><p class="tbx-k">' + esc(mi.title || 'Misión secreta') + '</p>' +
        '<p class="tbx-t">' + (yo && yo.name ? 'Tu misión Nº ' + esc(('0' + yo.card).slice(-2)) + ' te espera, ' + esc(yo.name) + '.' : 'Durante la boda serás nuestro fotógrafo encubierto.') + '</p>' +
        '<p class="tbx-n">Escribe tu nombre, recibe cinco momentos secretos que fotografiar y tus fotos saldrán en la pantalla en directo.</p>' +
        '<a class="btn" href="../mision/' + (yo && yo.name ? '#mision' : '') + '">' + CAM + (yo && yo.name ? 'Seguir con mi misión' : esc(mi.button || 'Empezar mi misión')) + '</a></div>';
    }
    if (b.song && b.song.url) {
      out += '<div class="tb-extra"><p class="tbx-k">Canción</p><p class="tbx-t">' + esc(b.song.label || '') + '</p>' +
        (b.song.note ? '<p class="tbx-n">' + esc(b.song.note) + '</p>' : '') +
        '<a class="btn line" href="' + esc(b.song.url) + '" target="_blank" rel="noopener">' + NOTE + esc(b.song.button || 'Seguir la letra') + '</a></div>';
    }
    if (b.ask && b.ask.text) {
      out += '<div class="tb-extra ask"><p class="tbx-k">' + esc(b.ask.label || 'Tu menú') + '</p><p class="tbx-t">' + esc(b.ask.text) + '</p>' +
        (b.ask.note ? '<p class="tbx-n">' + esc(b.ask.note) + '</p>' : '') +
        '<div class="btns">' + waButtons(data.contact || {}, b.ask.message) + '</div></div>';
    }
    return out;
  }
  function render() {
    var m = data.menu || { sections: [] };
    var pl = data.planning || { blocks: [] };
    var secs = {}; m.sections.forEach(function (s) { secs[s.id] = s; });
    var any = m.sections.some(function (s) { return s.items.some(function (it) { return (it.allergens || []).length; }); });
    $('filter-wrap').hidden = !any;
    var pend = m.sections.filter(function (s) { return s.pending; }).map(function (s) { var n = s.title.toLowerCase(); return ({ 'banquete': 'del banquete', 'recena': 'de la recena', 'bodega': 'de la bodega' })[n] || ('de ' + n); });
    var ptxt = (m.note ? m.note + ' ' : '') + (pend.length ? 'Los alérgenos ' + pend.join(', ').replace(/, ([^,]*)$/, ' y $1') + ' están pendientes de confirmar.' : '');
    $('pending-wrap').hidden = !ptxt; $('pending-text').textContent = ptxt;
    $('pending-btns').innerHTML = waButtons(data.contact || {});
    $('prov').hidden = !pl.provisional; $('prov').textContent = pl.note || '';
    var sel = Object.keys(selected).filter(function (k) { return selected[k]; });
    var cnt = { safe: 0, risky: 0 };
    var holder = $('holder'); holder.appendChild($('pending-wrap')); holder.appendChild($('filter-wrap'));
    var firstMenu = -1; (pl.blocks || []).some(function (b, i) { if ((b.menu || []).length) { firstMenu = i; return true; } });
    $('tline').innerHTML = (pl.blocks || []).map(function (b) {
      var groups = (b.menu || []).map(function (id) { return secs[id]; }).filter(Boolean);
        var bi = (pl.blocks || []).indexOf(b);
      return '<li class="tb"><div class="tb-time"><time>' + esc(b.time) + '</time></div><span class="tb-dot"></span>' +
        '<div class="tb-card glass"><h2 class="tb-title">' + esc(b.title) + '</h2>' + (b.detail ? '<p class="tb-detail">' + esc(b.detail) + '</p>' : '') + extrasHtml(b) + (bi === firstMenu ? '<div class="tb-slot" id="tb-slot"></div>' : '') +
        groups.map(function (s) {
          var op = !!openSec[s.id];
          var hits = (s.pending || s.noAllergens) ? 0 : s.items.filter(function (it) { return sel.some(function (k) { return (it.allergens || []).indexOf(k) >= 0; }); }).length;
          return '<div class="tb-group"><button type="button" class="tb-toggle" data-sec="' + esc(s.id) + '" aria-expanded="' + op + '"><span class="tg-title">' + esc(s.title) + '</span>' +
            (sel.length && any && !s.pending && !s.noAllergens ? '<span class="tg-hits' + (hits ? '' : ' zero') + '">' + (hits ? hits + ' con tus alergias' : 'Nada de lo que has marcado') + '</span>' : '') +
            '<span class="tg-btn">' + (op ? 'Ocultar' : 'Ver ' + s.items.length) + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></span></button>' +
            '<ul class="dishes"' + (op ? '' : ' hidden') + '>' + s.items.map(function (it) { return dishHtml(it, sel, any, cnt, s.noAllergens ? 'none' : s.pending); }).join('') + '</ul></div>';
        }).join('') + '</div></li>';
    }).join('');
    var slot = $('tb-slot'); if (slot) { slot.appendChild($('filter-wrap')); slot.appendChild($('pending-wrap')); }
    if (any) {
      $('filter-chips').innerHTML = ALLERGENS.map(function (a) {
        return '<button type="button" class="fchip' + (selected[a[0]] ? ' on' : '') + '" data-k="' + a[0] + '" aria-pressed="' + (selected[a[0]] ? 'true' : 'false') + '">' + a[1] + '</button>';
      }).join('');
      $('filter-res').textContent = sel.length ? (cnt.risky + ' platos contienen lo que has marcado · ' + cnt.safe + ' no lo declaran') : 'Marca tus alergias y te señalamos los platos que las contienen.';
    }
  }
  var openSec = {};
  document.addEventListener('click', function (e) {
    var tg = e.target.closest && e.target.closest('.tb-toggle');
    if (tg) { openSec[tg.dataset.sec] = !openSec[tg.dataset.sec]; render(); return; }
    var b = e.target.closest && e.target.closest('.fchip'); if (!b) return;
    selected[b.dataset.k] = !selected[b.dataset.k]; render();
  });

  render();
  /* Carga el contenido y lo vuelve a mirar cada minuto: así, cuando los novios
     activan la misión secreta, aparece sin que nadie tenga que recargar. */
  var lastSig = '';
  function load() {
    try {
      fetch('../content.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) {
        if (!t || t === lastSig) return;
        var j = JSON.parse(t);
        if (j && (j.menu || j.planning)) { lastSig = t; data = j; render(); }
      }).catch(function () {});
    } catch (e) {}
  }
  load();
  setInterval(function () { if (!document.hidden) load(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

  document.addEventListener('pointermove', function (e) {
    var el = e.target.closest ? e.target.closest('.glass') : null; if (!el) return;
    var r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });
})();
</script>

</body>
</html>
